[package]
name = "apka-szkolna-desktop"
version = "0.1.0"
description = "Apka szkolna - plywajace kolo fortuny nad podrecznikiem"
authors = ["Bartosz Kuninski"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1

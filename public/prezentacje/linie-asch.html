<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Która linia? - eksperyment Ascha</title>
<!--
  Eksperyment Ascha (1951) na projektor - lekcja wychowawcza kl. 4
  „Badacze klasy 1” (src/data/wychowawcze4.ts). Wersja bez zamieszania
  (Bartek 2026-11-18): nikt nie wychodzi z sali, nikt nie jest w zmowie.
  Klasa odpowiada chorem na 3 rysunki, a w ostatnim kroku przy rysunku 3
  pojawia sie "7 osob przed toba powiedzialo B" - glosowanie rekami.
  Strzalki / spacja = kroki. Wlasne linie, nie z oryginalu.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1ea; color: #1f1b16; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
  #ekran { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .naglowek { font-size: 2.2vw; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a7f6d; }
  h1 { font-size: 5vw; margin: .4em 0 .2em; text-align: center; }
  p { font-size: 2.6vw; margin: .3em 6vw; text-align: center; line-height: 1.35; }
  svg { width: 92vw; height: 66vh; }
  .pytanie { font-size: 2.5vw; font-weight: 700; margin-top: 1vh; }
  .grupa { display: flex; gap: 1.2vw; align-items: center; margin-top: 1vh; font-size: 2.3vw; font-weight: 700; }
  .grupa .os { width: 4.6vw; height: 4.6vw; border-radius: 50%; background: #c8302c; color: #fff; display: grid; place-items: center; font-size: 2.6vw; font-weight: 800; }
  .grupa .ty { background: #fff; color: #1d4e89; border: .35vw dashed #1d4e89; }
  svg.male { height: 54vh; }
</style>
</head>
<body>
<div id="ekran"></div>
<script>
// Dlugosci w jednostkach rysunku (1 = 1 px przy viewBox 1200x720).
// `dobra` to wlasciwa odpowiedz. Roznice ok. 20-25%: widac golym okiem, ale
// nie sa smieszne - jak u Ascha.
const PROBY = [
  { wz: 300, linie: [230, 300, 380] }, // B
  { wz: 200, linie: [200, 260, 150] }, // A
  { wz: 340, linie: [260, 420, 340] }, // C (grupa mowi B)
];
// Kroki: rysunki 1-3, potem rysunek 3 jeszcze raz z odpowiedziami grupy.
const ILE = PROBY.length + 1;
const ekran = document.getElementById('ekran');
let krok = 0;

function rysunek(p, klasa = '') {
  const dol = 570, skala = 1.1, gr = 16;
  const linia = (x, dl, etykieta, kolor) =>
    `<line x1="${x}" y1="${dol}" x2="${x}" y2="${dol - dl * skala}" stroke="${kolor}" stroke-width="${gr}" stroke-linecap="butt"/>` +
    `<text x="${x}" y="${dol + 80}" text-anchor="middle" font-size="64" font-weight="800" fill="#1f1b16">${etykieta}</text>`;
  return `<svg class="${klasa}" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
    <rect x="70" y="20" width="300" height="680" rx="24" fill="#fff" stroke="#ddd5c5" stroke-width="4"/>
    ${linia(220, p.wz, 'wzór', '#1d4e89')}
    <rect x="450" y="20" width="680" height="680" rx="24" fill="#fff" stroke="#ddd5c5" stroke-width="4"/>
    ${linia(600, p.linie[0], 'A', '#1f1b16')}
    ${linia(790, p.linie[1], 'B', '#1f1b16')}
    ${linia(980, p.linie[2], 'C', '#1f1b16')}
  </svg>`;
}

function pokaz() {
  if (krok < PROBY.length) {
    ekran.innerHTML = `<div class="naglowek">Rysunek ${krok + 1} z ${PROBY.length}</div>${rysunek(PROBY[krok])}
      <div class="pytanie">Która linia - A, B czy C - jest tak samo długa jak wzór?</div>`;
  } else {
    const os = Array.from({ length: 7 }, () => '<span class="os">B</span>').join('');
    ekran.innerHTML = `<div class="naglowek">Rysunek 3 jeszcze raz</div>${rysunek(PROBY[2], 'male')}
      <div class="grupa">7 osób przed tobą: ${os} <span>A ty?</span> <span class="os ty">?</span></div>`;
  }
  if (window.parent !== window) window.parent.postMessage({ typ: 'slajd-stan', krok, ile: ILE }, '*');
}
function ustaw(k) { krok = Math.max(0, Math.min(ILE - 1, k)); pokaz(); }

// W slajdzie apki (ramka): apka przysyla kroki, a strzalka poza pierwszy/ostatni
// krok wraca do apki i zmienia slajd (EmbedSlideView).
const wRamce = window.parent !== window;
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data || e.data.typ !== 'slajd-krok') return;
  ustaw(krok + (e.data.kierunek > 0 ? 1 : -1));
});
const doApki = (key) => { if (wRamce) window.parent.postMessage({ typ: 'slajd-klawisz', key }, '*'); };
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); krok === ILE - 1 ? doApki(e.key) : ustaw(krok + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); krok === 0 ? doApki(e.key) : ustaw(krok - 1); }
});
pokaz();
</script>
</body>
</html>

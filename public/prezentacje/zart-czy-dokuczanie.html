<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Żart czy dokuczanie?</title>
<!--
  Gra na projektor - lekcja wychowawcza kl. 4 „Badacze klasy 1”
  (src/data/wychowawcze4.ts). Pomysl: cwiczenie „Is this bullying?” z booklet
  NSW (Bystander to Upstander, Years 5-8), sytuacje wlasne.
  ?runda=1 albo ?runda=2 (po 5 sytuacji). Kazda sytuacja to 2 kroki:
  1) sama sytuacja - klasa glosuje kciukiem, 2) werdykt + co o nim decyduje.
  Strzalki / spacja = kroki. Bez emoji - szkolne komputery z Win7 ich nie maja.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1ea; color: #1f1b16; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
  #ekran { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6vw; box-sizing: border-box; }
  .naglowek { font-size: 2vw; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a7f6d; }
  .karta { margin-top: 2vh; background: #fff; border: .25vw solid #ddd5c5; border-radius: 2vw; padding: 3.5vh 4vw; width: 100%; box-sizing: border-box; font-size: 3.4vw; line-height: 1.3; font-weight: 700; text-align: center; }
  .glos { margin-top: 3vh; display: flex; gap: 3vw; font-size: 2.2vw; font-weight: 700; color: #5d5547; }
  .glos b { display: inline-block; padding: .2em .7em; border-radius: 99px; color: #fff; margin-right: .3em; }
  .zart { background: #2e7d3a; } .dok { background: #c8302c; } .zal { background: #c98a12; }
  .werdykt { margin-top: 3vh; display: flex; align-items: center; gap: 2vw; width: 100%; }
  .werdykt .pill { flex: none; font-size: 2.8vw; font-weight: 800; color: #fff; padding: .35em .9em; border-radius: 99px; }
  .werdykt .dlaczego { font-size: 2.5vw; line-height: 1.3; }
</style>
</head>
<body>
<div id="ekran"></div>
<script>
// werdykt: 'zart' | 'dok' | 'zal'. Sytuacje wlasne, bez imion - zeby nikt
// w klasie nie poczul sie wywolany.
const RUNDY = {
  1: [
    { s: 'Kolega z ławki rysuje ci w zeszycie śmieszną minkę. Obaj się śmiejecie, potem ty rysujesz jemu.', w: 'zart', d: 'Śmieją się <b>obie strony</b> i obie mogą odpowiedzieć tym samym.' },
    { s: 'Od tygodnia kilka osób mówi na koleżankę „Okularnica”. Ona udaje, że nie słyszy.', w: 'dok', d: '<b>Powtarza się</b>, ona się nie śmieje, a to <b>kilka osób na jedną</b>.' },
    { s: 'Na WF-ie ktoś nie trafia do kosza. Paru osobom wyrywa się „ojej!”, po chwili gracie dalej.', w: 'zart', d: 'Raz, bez złośliwości i nikt nie ciągnie tematu. Zwykła sytuacja w grze.' },
    { s: 'W grupie klasowej ktoś wrzuca czyjeś zdjęcie przerobione na ziemniaka. Pod spodem dużo śmiechu.', w: 'zal', d: 'Czy ta osoba <b>się zgodziła</b> i też się śmieje? Jeśli nie - to dokuczanie, i to na oczach całej klasy.' },
    { s: 'Kumpel chowa ci piórnik i oddaje po minucie. Robi to codziennie, a ty masz już dość.', w: 'dok', d: 'Zaczęło się jak żart, ale <b>powtarza się</b>, a tobie <b>już nie jest śmiesznie</b>.' },
  ],
  2: [
    { s: 'Uczniowie z 7 klasy każą komuś z 4 klasy zejść z ławki na boisku, „bo tak”.', w: 'dok', d: '<b>Silniejsi na słabszego</b>: starsi, więksi i jest ich więcej.' },
    { s: 'Dwie przyjaciółki wymyśliły sobie śmieszne przezwiska i tylko tak do siebie mówią.', w: 'zart', d: 'Obie <b>się zgadzają</b> i obie się bawią.' },
    { s: '„Ale masz dziwną kanapkę!” - mówi ktoś przy stoliku, wszyscy się śmieją, a ta osoba chowa kanapkę.', w: 'dok', d: 'Śmieje się <b>grupa z jednej osoby</b>, a ona się wstydzi. Nawet raz może mocno zaboleć.' },
    { s: 'Koleżanka mówi „przestań”, a on dalej przedrzeźnia jej głos. „Przecież to tylko żart!”', w: 'dok', d: 'Po słowie <b>„przestań”</b> żart się kończy. Dalej to już dokuczanie.' },
    { s: 'Ktoś zaprasza na urodziny tylko trzech najbliższych przyjaciół. Jedna osoba z klasy nie jest zaproszona.', w: 'zal', d: 'Nie każdy musi być zaproszony. Dokuczanie byłoby wtedy, gdyby <b>specjalnie</b> pokazywano jej zaproszenia albo się z tego śmiano.' },
  ],
};
const NAZWY = { zart: 'Żart', dok: 'Dokuczanie', zal: 'Zależy' };
const runda = new URLSearchParams(location.search).get('runda') === '2' ? 2 : 1;
const LISTA = RUNDY[runda];
const ILE = LISTA.length * 2;
const ekran = document.getElementById('ekran');
let krok = 0;

function pokaz() {
  const i = Math.floor(krok / 2), odkryte = krok % 2 === 1, x = LISTA[i];
  const glos = `<div class="glos"><span><b class="zart">kciuk w górę</b>żart</span><span><b class="dok">kciuk w dół</b>dokuczanie</span><span><b class="zal">kciuk w bok</b>zależy</span></div>`;
  const werdykt = `<div class="werdykt"><span class="pill ${x.w}">${NAZWY[x.w]}</span><span class="dlaczego">${x.d}</span></div>`;
  ekran.innerHTML = `<div class="naglowek">Runda ${runda} · sytuacja ${i + 1} z ${LISTA.length}</div>
    <div class="karta">${x.s}</div>${odkryte ? werdykt : glos}`;
  if (window.parent !== window) window.parent.postMessage({ typ: 'slajd-stan', krok, ile: ILE }, '*');
}
function ustaw(k) { krok = Math.max(0, Math.min(ILE - 1, k)); pokaz(); }

// W slajdzie apki (ramka): apka przysyla kroki, a strzalka poza pierwszy/ostatni
// krok wraca do apki i zmienia slajd (EmbedSlideView).
const wRamce = window.parent !== window;
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data || e.data.typ !== 'slajd-krok') return;
  ustaw(krok + (e.data.kierunek > 0 ? 1 : -1));
});
const doApki = (key) => { if (wRamce) window.parent.postMessage({ typ: 'slajd-klawisz', key }, '*'); };
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); krok === ILE - 1 ? doApki(e.key) : ustaw(krok + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); krok === 0 ? doApki(e.key) : ustaw(krok - 1); }
});
pokaz();
</script>
</body>
</html>
